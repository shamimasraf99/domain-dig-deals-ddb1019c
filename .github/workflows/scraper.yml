name: Auto Domain Scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, libxml, mbstring
          coverage: none

      - name: Run PHP Scraper
        working-directory: scraper
        run: php scrape.php



      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/domains.json; then
            echo "No changes to commit"
            exit 0
          fi
          git add public/domains.json
          git commit -m "chore: auto update domains.json [skip ci]"
          git push
