name: Auto Domain Scraper

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: scraper
        run: npm install

      - name: Run Scraper
        working-directory: scraper
        run: node scrape.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: public/domains.json
          commit-message: "chore: auto update domains.json [skip ci]"
          branch: auto/update-domains
          delete-branch: true
          title: "chore: auto update domains.json"
          body: |
            Automated update of `public/domains.json` by the scraper workflow.
            Please review changes before merging.
          labels: automated, scraper
          reviewers: shamimasraf99
