name: Auto Domain Scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, libxml, mbstring
          coverage: none

      - name: Run PHP Scraper
        working-directory: scraper
        run: php scrape.php



      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: public/domains.json
          commit-message: "chore: auto update domains.json [skip ci]"
          branch: auto/update-domains
          delete-branch: true
          title: "chore: auto update domains.json"
          body: |
            Automated update of `public/domains.json` by the PHP scraper workflow.
            Includes every TLD and every registrar offer scraped from domainoffer.net.
            Please review changes before merging.
          labels: automated, scraper
          reviewers: shamimasraf99
